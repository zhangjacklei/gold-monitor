name: 金价每日播报
# 每个工作日 09:38（北京时间）推送一遍当前四大行金价 + 上金所基准
# GitHub Actions 定时为 UTC，北京时间 = UTC+8：
#   09:38 北京时间 = 01:38 UTC；工作日 = 周一至周五（UTC 星期 1-5，当天不跨天）
on:
  schedule:
    - cron: '38 1 * * 1-5'       # 每个工作日 09:38 北京时间（周一至周五）
  workflow_dispatch:             # 允许手动触发测试

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 持久化 state：与阈值检查 workflow 共享同一份状态，使连续失败计数跨运行累积，
      # 达到阈值时由脚本推一条数据源告警（只推一次，恢复后再推）。
      - name: 恢复状态（预警档位 + 连续失败计数）
        uses: actions/cache@v4
        with:
          path: gold_alert_state.json
          key: gold-alert-state-${{ github.run_id }}
          restore-keys: |
            gold-alert-state-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 运行每日播报
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}          # Bark 设备钥匙（iOS 推送，推荐）
          BARK_SERVER: ${{ secrets.BARK_SERVER }}    # 可选：自建 Bark 服务地址
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}    # 可选：企业微信机器人 或 Server酱（改用它时填）
        run: python3 gold_monitor.py --mode report
